
name: Deploy Krude Streetwears to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --base-href /krude-streetwears/

      - name: Locate Angular build output
        shell: bash
        run: |
          if [ -f dist/krude-streetwears/browser/index.html ]; then
            echo "PUBLISH_DIR=dist/krude-streetwears/browser" >> "$GITHUB_ENV"
          elif [ -f dist/krude-streetwears/index.html ]; then
            echo "PUBLISH_DIR=dist/krude-streetwears" >> "$GITHUB_ENV"
          else
            echo "Could not find Angular index.html"
            find dist -name index.html
            exit 1
          fi

      - name: Support Angular page refreshes
        run: cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
